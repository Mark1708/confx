name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-release:
    name: Validate stable release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate version and tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const version = pkg.version;
          if (typeof version !== "string" || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error("Release version must be stable numeric X.Y.Z");
          }
          if (lock.version !== version || lock.packages?.[""]?.version !== version) {
            throw new Error("Package and lock root versions must match");
          }
          const ref = process.env.RELEASE_REF;
          if (ref.startsWith("refs/tags/") && ref !== `refs/tags/v${version}`) {
            throw new Error("Release tag must equal v followed by the package version");
          }
          console.log(`Validated stable release metadata for ${version}`);
          NODE

  verify:
    name: Verify R2 quality and privacy
    needs: validate-release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-chrome:
    name: Build Chrome release artifact
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Chrome artifact
        run: npm run build:chrome

      - name: Package Chrome ZIP
        run: npm run zip:chrome

      - name: Verify Chrome ZIP contents
        run: |
          set -euo pipefail
          test -s release/confx-chrome.zip
          python3 - <<'PY'
          import zipfile

          with zipfile.ZipFile('release/confx-chrome.zip') as archive:
              names = set(archive.namelist())

          if 'manifest.json' not in names:
              raise SystemExit('release/confx-chrome.zip must contain manifest.json at archive root')
          PY

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: confx-release-chrome
          path: release/confx-chrome.zip
          if-no-files-found: error

  build-yandex:
    name: Build Yandex release artifact
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      YANDEX_EXTENSION_ID: cjhpodjghfokdfoljmfbgibjjfpafdip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare Yandex signing key
        env:
          YANDEX_CRX_PRIVATE_KEY_B64: ${{ secrets.YANDEX_CRX_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$YANDEX_CRX_PRIVATE_KEY_B64"
          key_path="$RUNNER_TEMP/yandex.pem"
          printf '%s' "$YANDEX_CRX_PRIVATE_KEY_B64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "YANDEX_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build Yandex artifact
        run: npm run build:yandex

      - name: Pack Yandex artifact
        run: npm run pack:yandex

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          test -s release/confx-yandex.crx

      - name: Remove temporary signing key
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${YANDEX_KEY_PATH:-}" ] && [ -f "$YANDEX_KEY_PATH" ]; then
            rm -f "$YANDEX_KEY_PATH"
          fi

      - name: Upload Yandex artifact
        uses: actions/upload-artifact@v4
        with:
          name: confx-release-yandex
          path: release/confx-yandex.crx
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-chrome
      - build-yandex
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: npm run checksums

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          test -s release/confx-chrome.zip
          test -s release/confx-yandex.crx
          test -s release/SHA256SUMS
          python3 - <<'PY'
          import zipfile

          with zipfile.ZipFile('release/confx-chrome.zip') as archive:
              names = set(archive.namelist())

          if 'manifest.json' not in names:
              raise SystemExit('release/confx-chrome.zip must contain manifest.json at archive root')
          PY

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "ConfX release $tag"
          gh release upload "$tag" \
            release/confx-chrome.zip \
            release/confx-yandex.crx \
            release/SHA256SUMS \
            --clobber
